name: Quet nen 4 gio va suc manh tien te

on:
  schedule:
    - cron: "7 * * * 0-5"
  workflow_dispatch:
    inputs:
      luon_gui:
        description: "Gửi Telegram ngay cả khi chưa có nến 4 giờ mới (gõ: co)"
        required: false
        default: "co"

permissions:
  contents: write

jobs:
  quet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Phan tich va gui Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIA_CHI_WEB: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          LUON_GUI_TELEGRAM: ${{ github.event.inputs.luon_gui }}
        run: python phan_tich.py
      - name: Luu ket qua len trang web
        run: |
          git config user.name "may-quet-nen"
          git config user.email "may-quet-nen@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Cập nhật kết quả quét"
          git pull --rebase origin main
          git push
          
